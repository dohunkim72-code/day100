<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-surface": "#2e3132",
                        "surface-bright": "#f8f9fb",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#d8e2ff",
                        "surface-container": "#edeef0",
                        "surface-tint": "#005ac2",
                        "on-tertiary-fixed": "#311400",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-primary-container": "#fefcff",
                        "surface-container-high": "#e7e8ea",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#405682",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "surface-dim": "#d9dadc",
                        "tertiary-fixed": "#ffdcc6",
                        "primary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "tertiary": "#924700",
                        "outline": "#727785",
                        "secondary-container": "#b6ccff",
                        "error": "#ba1a1a",
                        "secondary": "#495e8a",
                        "primary-container": "#2170e4",
                        "tertiary-container": "#b75b00",
                        "on-secondary-fixed": "#001a42",
                        "surface": "#f8f9fb",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#424754",
                        "on-primary-fixed": "#001a42",
                        "inverse-on-surface": "#f0f1f3",
                        "surface-container-low": "#f3f4f6",
                        "outline-variant": "#c2c6d6",
                        "primary": "#0058be",
                        "secondary-fixed-dim": "#b1c6f9",
                        "surface-container-highest": "#e1e2e4",
                        "on-secondary-fixed-variant": "#304671",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-surface": "#191c1e",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-variant": "#e1e2e4",
                        "inverse-primary": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f8f9fb",
                        "on-background": "#191c1e"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex items-center w-full px-5 h-16 bg-slate-50 dark:bg-slate-950 sticky top-0 z-50">
<div class="flex items-center gap-4 w-full">
<button class="material-symbols-outlined text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors p-2 rounded-full Active: opacity-70 transition-opacity">
                arrow_back
            </button>
<h1 class="font-manrope font-bold text-lg tracking-tight text-slate-900 dark:text-slate-100">회원 정보 수정</h1>
</div>
</header>
<main class="max-w-md mx-auto px-5 pt-6 space-y-10">
<!-- Section: 비밀번호 변경 -->
<section class="space-y-4">
<div class="flex flex-col gap-1">
<h2 class="font-headline text-lg font-bold text-on-surface">비밀번호 변경</h2>
<p class="text-label-md text-on-surface-variant text-xs">안전한 서비스 이용을 위해 정기적으로 변경해 주세요.</p>
</div>
<div class="space-y-3">
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="현재 비밀번호" type="password"/>
</div>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="새 비밀번호" type="password"/>
</div>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="새 비밀번호 확인" type="password"/>
</div>
</div>
</section>
<!-- Section: 휴대폰 번호 -->
<section class="space-y-4">
<h2 class="font-headline text-lg font-bold text-on-surface">휴대폰 번호</h2>
<div class="space-y-3">
<div class="flex gap-2">
<input class="flex-1 h-14 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="010-0000-0000" type="tel"/>
<button class="px-6 h-14 bg-surface-container-high text-primary font-semibold rounded-lg hover:bg-surface-container-highest transition-colors whitespace-nowrap">인증요청</button>
</div>
<div class="flex gap-2">
<input class="flex-1 h-14 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="인증번호" type="text"/>
<button class="px-6 h-14 bg-primary text-white font-semibold rounded-lg hover:bg-primary-container transition-colors whitespace-nowrap">인증확인</button>
</div>
</div>
</section>
<!-- Section: 정산 계좌 정보 -->
<section class="space-y-4">
<h2 class="font-headline text-lg font-bold text-on-surface">정산 계좌 정보</h2>
<div class="space-y-3 bg-surface-container-lowest p-5 rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.02)]">
<div class="flex flex-col gap-2">
<label class="text-xs font-bold text-on-surface-variant px-1">은행명</label>
<select class="w-full h-12 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface appearance-none">
<option>은행을 선택해주세요</option>
<option>신한은행</option>
<option>국민은행</option>
<option>카카오뱅크</option>
<option>토스뱅크</option>
</select>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-bold text-on-surface-variant px-1">계좌번호</label>
<input class="w-full h-12 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="'-' 없이 숫자만 입력" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-bold text-on-surface-variant px-1">예금주</label>
<input class="w-full h-12 bg-surface-container-low border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant" placeholder="성함 입력" type="text"/>
</div>
</div>
</section>
<!-- Section: 통장 사본 업로드 -->
<section class="space-y-4">
<h2 class="font-headline text-lg font-bold text-on-surface">통장 사본 업로드</h2>
<div class="group relative flex flex-col items-center justify-center gap-3 w-full h-40 border-2 border-dashed border-outline-variant rounded-2xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary">cloud_upload</span>
</div>
<div class="text-center">
<p class="text-sm font-semibold text-on-surface">통장 사본 업로드 (본인 명의)</p>
<p class="text-xs text-on-surface-variant mt-1">JPG, PNG, PDF (최대 10MB)</p>
</div>
<input class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</section>
<!-- Primary Action -->
<div class="pt-8 pb-10">
<button class="w-full h-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-white font-headline font-bold text-lg shadow-[0_12px_40px_rgba(0,88,190,0.15)] Active: scale-95 duration-200 ease-out">
                수정 완료
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-4 right-4 z-50 flex justify-around items-center h-20 max-w-lg mx-auto bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg rounded-3xl shadow-[0_12px_40px_0px_rgba(0,0,0,0.04)] tonal-layering via surface-container-low">
<!-- Inactive: 기록하기 -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1">edit_note</span>
<span class="font-manrope text-[10px] font-semibold uppercase tracking-widest">기록하기</span>
</a>
<!-- Inactive: 내역 -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-manrope text-[10px] font-semibold uppercase tracking-widest">내역</span>
</a>
<!-- Active: 내 정보 -->
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 rounded-2xl px-6 py-2 transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-manrope text-[10px] font-semibold uppercase tracking-widest">내 정보</span>
</a>
</nav>
</body></html>
