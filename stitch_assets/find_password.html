<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#adc6ff",
              "on-primary": "#ffffff",
              "surface-tint": "#005ac2",
              "secondary-fixed": "#d8e2ff",
              "on-primary-fixed-variant": "#004395",
              "tertiary": "#924700",
              "primary": "#0058be",
              "on-tertiary-fixed": "#311400",
              "on-tertiary": "#ffffff",
              "surface": "#f8f9fb",
              "secondary": "#495e8a",
              "on-secondary-fixed": "#001a42",
              "outline": "#727785",
              "on-secondary-fixed-variant": "#304671",
              "on-background": "#191c1e",
              "surface-container-high": "#e7e8ea",
              "on-surface-variant": "#424754",
              "tertiary-container": "#b75b00",
              "secondary-fixed-dim": "#b1c6f9",
              "inverse-on-surface": "#f0f1f3",
              "surface-container-lowest": "#ffffff",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdcc6",
              "on-primary-fixed": "#001a42",
              "surface-dim": "#d9dadc",
              "inverse-primary": "#adc6ff",
              "error-container": "#ffdad6",
              "surface-bright": "#f8f9fb",
              "primary-fixed": "#d8e2ff",
              "on-tertiary-container": "#fffbff",
              "primary-container": "#2170e4",
              "tertiary-fixed-dim": "#ffb786",
              "surface-container-low": "#f3f4f6",
              "on-error-container": "#93000a",
              "surface-container": "#edeef0",
              "surface-container-highest": "#e1e2e4",
              "on-secondary-container": "#405682",
              "on-secondary": "#ffffff",
              "background": "#f8f9fb",
              "on-surface": "#191c1e",
              "on-primary-container": "#fefcff",
              "on-tertiary-fixed-variant": "#723600",
              "secondary-container": "#b6ccff",
              "error": "#ba1a1a",
              "surface-variant": "#e1e2e4",
              "inverse-surface": "#2e3132",
              "outline-variant": "#c2c6d6"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        .headline-text {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-slate-50 dark:bg-slate-950 flex items-center justify-between px-5 h-16 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors duration-200">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">arrow_back</span>
</button>
<h1 class="font-manrope font-bold text-xl text-on-surface">ID/PW 찾기</h1>
</div>
<div class="font-manrope font-extrabold text-blue-700 dark:text-blue-400">일당백 (Day100)</div>
</header>
<main class="w-full max-w-md px-5 pt-8 pb-20 flex flex-col gap-8">
<!-- Segmented Controls (Toggle Rail) -->
<div class="bg-surface-container-high p-1.5 rounded-xl flex w-full relative">
<button class="flex-1 py-3 text-sm font-medium text-on-surface-variant z-10">아이디 찾기</button>
<div class="flex-1 py-3 text-sm font-bold text-primary z-10 bg-surface-container-lowest rounded-lg shadow-[0_12px_40px_rgba(0,0,0,0.04)] text-center">
                비밀번호 찾기
            </div>
</div>
<!-- Form Section -->
<section class="flex flex-col gap-10">
<div class="space-y-6">
<!-- Input Group: ID -->
<div class="space-y-2">
<label class="font-label text-xs font-semibold text-on-surface-variant ml-1">아이디</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="아이디를 입력해주세요" type="text"/>
</div>
</div>
<!-- Input Group: Phone Number -->
<div class="space-y-2">
<label class="font-label text-xs font-semibold text-on-surface-variant ml-1">휴대폰 번호</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="'-' 제외 숫자만 입력" type="tel"/>
</div>
</div>
</div>
<!-- Action Button -->
<div class="space-y-6">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-full font-headline font-bold text-sm shadow-[0_12px_40px_rgba(0,0,0,0.08)] active:scale-95 transition-all">임시 비밀번호 발급</button>
<!-- Status Message (Success/Info Card) -->
<div class="bg-surface-container-low p-5 rounded-2xl flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-xl mt-0.5" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="text-sm text-on-surface leading-relaxed">
                        입력하신 휴대폰 번호로 임시 비밀번호가 발송되었습니다.
                    </p>
</div>
</div>
</section>
<!-- Editorial/Visual Decor (Bento-ish element) -->
</main>
<!-- Navigation suppressed due to Transactional/Focused Journey context -->
</body></html>
