<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#adc6ff",
              "on-primary": "#ffffff",
              "surface-tint": "#005ac2",
              "secondary-fixed": "#d8e2ff",
              "on-primary-fixed-variant": "#004395",
              "tertiary": "#924700",
              "primary": "#0058be",
              "on-tertiary-fixed": "#311400",
              "on-tertiary": "#ffffff",
              "surface": "#f8f9fb",
              "secondary": "#495e8a",
              "on-secondary-fixed": "#001a42",
              "outline": "#727785",
              "on-secondary-fixed-variant": "#304671",
              "on-background": "#191c1e",
              "surface-container-high": "#e7e8ea",
              "on-surface-variant": "#424754",
              "tertiary-container": "#b75b00",
              "secondary-fixed-dim": "#b1c6f9",
              "inverse-on-surface": "#f0f1f3",
              "surface-container-lowest": "#ffffff",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdcc6",
              "on-primary-fixed": "#001a42",
              "surface-dim": "#d9dadc",
              "inverse-primary": "#adc6ff",
              "error-container": "#ffdad6",
              "surface-bright": "#f8f9fb",
              "primary-fixed": "#d8e2ff",
              "on-tertiary-container": "#fffbff",
              "primary-container": "#2170e4",
              "tertiary-fixed-dim": "#ffb786",
              "surface-container-low": "#f3f4f6",
              "on-error-container": "#93000a",
              "surface-container": "#edeef0",
              "surface-container-highest": "#e1e2e4",
              "on-secondary-container": "#405682",
              "on-secondary": "#ffffff",
              "background": "#f8f9fb",
              "on-surface": "#191c1e",
              "on-primary-container": "#fefcff",
              "on-tertiary-fixed-variant": "#723600",
              "secondary-container": "#b6ccff",
              "error": "#ba1a1a",
              "surface-variant": "#e1e2e4",
              "inverse-surface": "#2e3132",
              "outline-variant": "#c2c6d6"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-5 h-16 w-full sticky top-0 bg-slate-50 dark:bg-slate-950 z-40 transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors duration-200">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope font-bold text-xl text-blue-700 dark:text-blue-400">ID/PW 찾기</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-5 pt-6 pb-24 max-w-lg mx-auto w-full">
<!-- Tabs Section -->
<div class="bg-surface-container-high rounded-xl p-1 mb-10 flex">
<button class="flex-1 py-3 text-sm font-semibold rounded-lg bg-surface-container-lowest shadow-[0_12px_40px_rgba(0,0,0,0.04)] text-blue-700">
                아이디 찾기
            </button>
<button class="flex-1 py-3 text-sm font-medium text-on-surface-variant hover:bg-slate-200/50 transition-colors rounded-lg">
                비밀번호 찾기
            </button>
</div>
<!-- Form Section -->
<section class="space-y-8">
<div class="space-y-2">
<h2 class="font-headline font-bold text-2xl tracking-tight">가입 시 등록한<br/>휴대폰 번호를 입력해주세요.</h2>
<p class="text-on-surface-variant text-sm">본인 확인을 위해 필요합니다.</p>
</div>
<div class="space-y-4">
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-2 ml-1">휴대폰 번호</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/50 transition-all outline-none" placeholder="010-0000-0000" type="tel"/>
</div>
</div>
<button class="w-full h-14 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_12px_40px_rgba(0,88,190,0.15)] active:scale-[0.98] transition-all">
                아이디 찾기
            </button>
</section>
<!-- Informational Card (Editorial Detail) -->
<div class="mt-12 p-6 bg-surface-container-lowest rounded-2xl border border-outline-variant/10">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="info">info</span>
</div>
<div>
<h3 class="font-bold text-sm mb-1">도움이 필요하신가요?</h3>
<p class="text-on-surface-variant text-xs leading-relaxed">휴대폰 번호가 변경되었거나 접근이 불가능한 경우 고객센터(1588-0000)로 문의주시기 바랍니다.</p>
</div>
</div>
</div>
</main>
<!-- Success Popup Overlay (Mockup) -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-6">
<div class="absolute inset-0 bg-on-surface/40 backdrop-blur-md"></div>
<div class="relative bg-surface-container-lowest w-full max-w-sm rounded-[2rem] p-8 shadow-[0_40px_80px_rgba(0,0,0,0.12)] text-center">
<div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-blue-700 text-4xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-headline font-extrabold text-xl text-on-surface mb-2">아이디 찾기 완료</h3>
<p class="text-on-surface-variant text-sm mb-8">귀하의 아이디는 <span class="text-blue-700 font-bold">day100***</span> 입니다.</p>
<div class="flex flex-col gap-3">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-bold transition-transform active:scale-95">
                    로그인하러 가기
                </button>
<button class="w-full h-14 rounded-full bg-surface-container-high text-on-surface-variant font-semibold transition-transform active:scale-95">
                    비밀번호 찾기
                </button>
</div>
</div>
</div>
<!-- BottomNavBar (Suppressed for focused task, but kept logic for shell reference if needed elsewhere) -->
<!-- According to "The Destination Rule": Transactional/Task-focused pages suppress the shell. -->
<div class="fixed bottom-0 w-full z-10 px-6 pb-8 pointer-events-none">
<!-- Background decorative blur element -->
<div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent h-32 bottom-0"></div>
</div>
</body></html>
